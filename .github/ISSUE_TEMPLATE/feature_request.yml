name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong for you or your agent today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: verify
    attributes:
      label: How would we know it works?
      description: A fixture or measurable check.
