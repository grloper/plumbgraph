# Source of truth for the repository's labels (applied with `gh label create --force`; not synced automatically).
- {name: bug, color: d73a4a, description: "Something isn't working"}
- {name: enhancement, color: a2eeef, description: "New feature or request"}
- {name: documentation, color: 0075ca, description: "Improvements or additions to documentation"}
- {name: false-positive, color: fbca04, description: "A finding that is wrong"}
- {name: false-negative, color: e99695, description: "A finding that is missing"}
- {name: "area: dead-code", color: 1d76db, description: "dead-code engine"}
- {name: "area: check-deps", color: 1d76db, description: "dependency checks and registries"}
- {name: "area: verify", color: 1d76db, description: "verify gate, baseline, providers"}
- {name: "area: mcp", color: 1d76db, description: "MCP server"}
- {name: "area: languages", color: 1d76db, description: "language packs and extraction"}
- {name: "area: scip-lsp", color: 1d76db, description: "SCIP overlay, diagnostics, LSP"}
- {name: security, color: b60205, description: "Security-relevant (report vulnerabilities privately)"}
- {name: breaking, color: 5319e7, description: "Changes output formats or the MCP contract"}
- {name: release, color: 0e8a16, description: "Release preparation"}
- {name: good first issue, color: 7057ff, description: "Good for newcomers"}
- {name: help wanted, color: 008672, description: "Extra attention is needed"}
