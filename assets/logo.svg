<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Plumbgraph: a plumb line hanging over a small code graph</title>
  <rect width="256" height="256" rx="48" fill="#1E293B"/>
  <!-- graph edges -->
  <g stroke="#475569" stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="150" x2="62" y2="190"/>
    <line x1="128" y1="150" x2="194" y2="190"/>
    <line x1="62" y1="190" x2="104" y2="224"/>
    <line x1="194" y1="190" x2="152" y2="224"/>
    <line x1="62" y1="190" x2="194" y2="190" stroke-dasharray="2 10"/>
  </g>
  <!-- unreachable node (finding) -->
  <circle cx="214" cy="104" r="11" fill="none" stroke="#EF4444" stroke-width="5"/>
  <line x1="206" y1="96" x2="222" y2="112" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
  <!-- graph nodes -->
  <g fill="#14B8A6">
    <circle cx="62" cy="190" r="13"/>
    <circle cx="194" cy="190" r="13"/>
    <circle cx="104" cy="224" r="9"/>
    <circle cx="152" cy="224" r="9"/>
  </g>
  <!-- plumb line -->
  <line x1="128" y1="28" x2="128" y2="118" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="28" r="7" fill="#E2E8F0"/>
  <!-- bob -->
  <path d="M128 112 L148 140 L128 168 L108 140 Z" fill="#F59E0B" stroke="#FBBF24" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="128" cy="150" r="0" fill="#14B8A6"/>
</svg>
