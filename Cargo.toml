[workspace]
resolver = "3"
members = ["crates/langs", "crates/core", "crates/mcp", "crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/grloper/plumbgraph"
homepage = "https://github.com/grloper/plumbgraph"
authors = ["Plumbgraph contributors"]
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
streaming-iterator = "0.1"
tempfile = "3"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
protobuf = "=3.7.2"
scip = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
globset = "0.4"
plumbgraph-langs = { path = "crates/langs", version = "1.0.0" }
plumbgraph-core = { path = "crates/core", version = "1.0.0" }
plumbgraph-mcp = { path = "crates/mcp", version = "1.0.0" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
