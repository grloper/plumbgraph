<text xml:space="preserve" x="22" y="52" style="opacity:0;animation:k0 7.7s linear infinite"><tspan class="prompt">$ </tspan><tspan class="cmd">plumb verify --run --online --baseline plumb-baseline.json</tspan></text><text xml:space="preserve" x="22" y="71" class="sev-me" style="opacity:0;animation:k1 7.7s linear infinite">MEDIUM 0.70  src/app.py:4  `fastjsonx_utils` is not declared and does not exist on pypi  [registry:pypi]</text><text xml:space="preserve" x="22" y="90" class="dim" style="opacity:0;animation:k2 7.7s linear infinite">         why:  `fastjsonx_utils` is imported at src/app.py:4</text><text xml:space="preserve" x="22" y="109" class="dim" style="opacity:0;animation:k3 7.7s linear infinite">         why:  not declared in any pypi manifest covering this file</text><text xml:space="preserve" x="22" y="128" class="dim" style="opacity:0;animation:k4 7.7s linear infinite">         why:  pypi returned 404 for `fastjsonx_utils`</text><text xml:space="preserve" x="22" y="147" class="dim" style="opacity:0;animation:k5 7.7s linear infinite">         risk: a Python import name can differ from its distribution name (known mappings are built in; others are not)</text><text xml:space="preserve" x="22" y="166" class="sev-me" style="opacity:0;animation:k6 7.7s linear infinite">MEDIUM 0.88  src/app.py:4:8  F401 `fastjsonx_utils` imported but unused  [lint:ruff]</text><text xml:space="preserve" x="22" y="185" class="dim" style="opacity:0;animation:k7 7.7s linear infinite">         why:  reported by lint:ruff at src/app.py:4:8</text><text xml:space="preserve" x="22" y="204" class="dim" style="opacity:0;animation:k8 7.7s linear infinite">         risk: tool output depends on the local environment (toolchain version, installed dependencies, configuration)</text><text xml:space="preserve" x="22" y="223" class="sev-me" style="opacity:0;animation:k9 7.7s linear infinite">MEDIUM 0.77  src/app.py:16  function `legacy_export` appears unused  [t0-treesitter]</text><text xml:space="preserve" x="22" y="242" class="dim" style="opacity:0;animation:k10 7.7s linear infinite">         why:  no reference edges from any code (0 incoming)</text><text xml:space="preserve" x="22" y="261" class="dim" style="opacity:0;animation:k11 7.7s linear infinite">         why:  not reachable from entry points (main, tests, module-level code, exported API in --mode lib, keep/allow-list)</text><text xml:space="preserve" x="22" y="280" class="dim" style="opacity:0;animation:k12 7.7s linear infinite">         why:  the name `legacy_export` occurs nowhere else in the indexed code (identifiers, strings, import lists)</text><text xml:space="preserve" x="22" y="299" class="dim" style="opacity:0;animation:k13 7.7s linear infinite">         risk: exported/public: may be used by consumers outside the indexed code</text><text xml:space="preserve" x="22" y="318" class="dim" style="opacity:0;animation:k14 7.7s linear infinite">         risk: tier-0 analysis is name-based: it does not see reflection, macros, or code outside the indexed files</text><text xml:space="preserve" x="22" y="337" class="sev-me" style="opacity:0;animation:k15 7.7s linear infinite">MEDIUM 0.85  src/app.py:22:5  use logging instead of print()  [ast-grep]</text><text xml:space="preserve" x="22" y="356" class="dim" style="opacity:0;animation:k16 7.7s linear infinite">         why:  ast-grep rule `demo-no-print` matched</text><text xml:space="preserve" x="22" y="375" class="dim" style="opacity:0;animation:k17 7.7s linear infinite">         risk: a rule match is a pattern match, not proof of a defect; review the rule&#x27;s intent</text><text xml:space="preserve" x="22" y="394" class="sev-me" style="opacity:0;animation:k18 7.7s linear infinite">MEDIUM 0.85  src/calc.py:5:12  eval() on dynamic input is dangerous  [semgrep]</text><text xml:space="preserve" x="22" y="413" class="dim" style="opacity:0;animation:k19 7.7s linear infinite">         why:  semgrep rule `demo-no-eval` matched</text><text xml:space="preserve" x="22" y="432" class="dim" style="opacity:0;animation:k20 7.7s linear infinite">         risk: a rule match is a pattern match, not proof of a defect; review the rule&#x27;s intent</text><text xml:space="preserve" x="22" y="451" class="fg" style="opacity:0;animation:k21 7.7s linear infinite"></text><text xml:space="preserve" x="22" y="470" class="fg" style="opacity:0;animation:k22 7.7s linear infinite">  dead-code        ran      1 finding(s)</text><text xml:space="preserve" x="22" y="489" class="fg" style="opacity:0;animation:k23 7.7s linear infinite">  check-deps       ran      1 finding(s)</text><text xml:space="preserve" x="22" y="508" class="fg" style="opacity:0;animation:k24 7.7s linear infinite">  test-weakening   ran      0 finding(s)  (vs HEAD)</text><text xml:space="preserve" x="22" y="527" class="fg" style="opacity:0;animation:k25 7.7s linear infinite">  diagnostics      ran      1 finding(s)  (pyright: skipped)</text><text xml:space="preserve" x="22" y="546" class="fg" style="opacity:0;animation:k26 7.7s linear infinite">  semgrep          ran      1 finding(s)</text><text xml:space="preserve" x="22" y="565" class="fg" style="opacity:0;animation:k27 7.7s linear infinite">  ast-grep         ran      1 finding(s)</text><text xml:space="preserve" x="22" y="584" class="fg" style="opacity:0;animation:k28 7.7s linear infinite"></text><text xml:space="preserve" x="22" y="603" class="bad" style="opacity:0;animation:k29 7.7s linear infinite">verify: FAIL  (5 new, 0 baselined, 0 fixed since baseline; fail-on medium)</text><text xml:space="preserve" x="22" y="622" class="dim" style="opacity:0;animation:k30 7.7s linear infinite">note: dead-code findings are name-based unless a SCIP index covers the file (see `plumb scip`); `new` means not in the baseline, not necessarily introduced by this change</text><text xml:space="preserve" x="22" y="641" class="dim" style="opacity:0;animation:k31 7.7s linear infinite">note: baseline fingerprints ignore line numbers; renaming a symbol or file makes its findings new</text><text xml:space="preserve" x="22" y="660" class="dim" style="opacity:0;animation:k32 7.7s linear infinite">note: no baseline found at plumb-baseline.json: every finding counts as new (create one with --update-baseline)</text>
